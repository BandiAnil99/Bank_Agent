services:
  - type: web
    name: bank-agent-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_PATH
        value: /tmp/banking.db
      - key: API_BASE_URL
        value: http://127.0.0.1:10000
      - key: MOCK_AUTH_ENABLED
        value: "true"
